
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4ff;
            padding: 80px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        button {
            padding: 12px 20px;
            background: #ff9900;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Web App!</h1>
        <p>This website is deployed using AWS Amplify.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "My web application is working successfully!";
        }
    </script>
</body>
</html>
